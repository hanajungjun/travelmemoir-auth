<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Logging in...</title>
  </head>
  <body>
    <p>로그인 처리 중입니다…</p>

    <script>
      // URL에서 code 파라미터 읽기
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (code) {
        // Flutter 앱으로 다시 돌려보내기
        const redirectUrl =
          "io.supabase.flutter://login-callback?code=" + code;

        window.location.href = redirectUrl;
      } else {
        document.body.innerHTML = "<p>잘못된 접근입니다.</p>";
      }
    </script>
  </body>
</html>
